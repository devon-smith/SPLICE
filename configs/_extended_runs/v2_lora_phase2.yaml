backbone: facebook/dinov2-base
head:
  hidden: [512, 128]
  dropout: 0.1
lora:
  target_modules: [query, value]
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  bias: none
optim:
  lr_head: 1.0e-3
  lr_backbone: 5.0e-5
  weight_decay: 1.0e-4
  schedule: cosine
train:
  epochs: 35
  patience: 7
  batch_size: 32
  max_cuts_per_epoch: 25000
  grad_accumulation: 4
