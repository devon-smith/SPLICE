backbone: facebook/dinov2-base
head:
  hidden: [512, 128]
  dropout: 0.1
lora:
  target_modules: [query, value]
  r: 8           # default for single runs; overridden by sweep grid
  lora_alpha: 16
  lora_dropout: 0.1
  bias: none
optim:
  lr_head: 1.0e-3
  lr_backbone: 5.0e-5  # keep backbone LR << head LR
  weight_decay: 1.0e-4
  schedule: cosine
train:
  epochs: 10
  patience: 3
  batch_size: 32          # pairs per step; DINOv2 sees 2x images
  max_cuts_per_epoch: 25000   # random subsample of train each epoch for fast iterations
  grad_accumulation: 4    # effective batch = 128
# Sweep grid -- all combinations of r x lora_alpha x lr_backbone are run
sweep:
  r: [4, 8, 16]
  lora_alpha: [8, 16, 32]   # script pairs each r with alpha=2r by default; full cross if listed
  lr_backbone: [5.0e-5]     # add 1.0e-4 here to also sweep backbone LR
